plugins {
  id 'java-library'
  id 'maven-publish'
  id "checkstyle"
}

if (System.getenv("SNAPSHOT") != null) {
  String buildNumber = System.getenv("BUILD_NUMBER")

  if (buildNumber != null) {
    version += "-$buildNumber"
  }
}

base {
  archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(java_version)
  withSourcesJar()
}

repositories {
  mavenCentral()
  // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
  exclusiveContent {
    forRepository {
      maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
      }
    }
    filter { includeGroupAndSubgroups('org.spongepowered') }
  }
}

sourcesJar {
  from(rootProject.file('LICENSE.md')) {
    rename { "${it}" }
  }
}

jar {
  from(rootProject.file('LICENSE.md')) {
    rename { "${it}" }
  }

  manifest {
    attributes([
        'Specification-Title'   : mod_name,
        'Specification-Vendor'  : mod_author,
        'Specification-Version' : project.jar.archiveVersion,
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor' : mod_author,
        'Built-On-Minecraft'    : minecraft_version
    ])
  }
}

processResources {
  var expandProps = [
      'version'                      : rootProject.version, // Make sure snapshots aren't included
      'group'                        : project.group, // Else we target the task's group.
      'minecraft_version'            : minecraft_version,
      'minecraft_version_range'      : minecraft_version_range,
      'fabric_version'               : fabric_version,
      'fabric_loader_version'        : fabric_loader_version,
      'mod_name'                     : mod_name,
      'mod_author'                   : mod_author,
      'mod_id'                       : mod_id,
      'license'                      : license,
      'issues'                       : issues,
      'description'                  : project.description,
      'credits'                      : credits,
      'java_version'                 : java_version,
  ]

  filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
    expand expandProps
  }
  inputs.properties(expandProps)
}


checkstyleMain {
  configFile = rootProject.file('config/checkstyle/checkstyle.xml')
  configProperties = [ 'checkstyle.cache.file': "${buildDir}/checkstyle.cache" ]
  ignoreFailures = true
  showViolations = true
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = base.archivesName.get()
      from components.java
    }
  }

  repositories {
    mavenLocal()
    maven {
      url = System.getenv('MAVEN_PUBLISH_URL')

      credentials {
        username = System.getenv('local_maven_user')
        password = System.getenv('local_maven_token')
      }

      authentication {
        basic(BasicAuthentication)
      }
    }
  }
}
