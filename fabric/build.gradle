plugins {
  id 'me.modmuss50.mod-publish-plugin'
  id 'net.fabricmc.fabric-loom'
  id 'multiloader-loader'
}

dependencies {
  minecraft "com.mojang:minecraft:${minecraft_version}"

  implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
  implementation fabricApi.module("fabric-message-api-v1", project.fabric_version)
  implementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)

  implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

repositories {
  mavenLocal()
  maven { url = "https://maven.fabricmc.net" }
  maven { url = "https://maven.terraformersmc.com/" }
}
